version: "3.8"

services:
  # =========================================================================
  # INFRASTRUCTURE
  # =========================================================================

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowdesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.8
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  # =========================================================================
  # ORDER SERVICE
  # =========================================================================

  order-service:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    environment:
      ORDER_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/order_service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # REFUND SERVICE
  # =========================================================================

  refund-service:
    build:
      context: .
      dockerfile: refund_service/Dockerfile
    environment:
      REFUND_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/refund_service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # DELIVERY SIMULATOR
  # =========================================================================

  delivery-simulator:
    build:
      context: .
      dockerfile: delivery_simulator/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_EVENTS_TOPIC: order.events
      DELIVERY_EVENTS_TOPIC: delivery.events
      DELAY_PROBABILITY: "0.3"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # FLOWDESK API (Support Agent)
  # =========================================================================

  flowdesk-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/flowdesk
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_ENV: ${PINECONE_ENV}
      ORDER_SERVICE_URL: http://order-service:8001
      REFUND_SERVICE_URL: http://refund-service:8002
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_healthy
      refund-service:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # FRONTEND (Next.js Demo)
  # =========================================================================

  flowdesk-frontend:
    build:
      context: ./flowdesk-demo
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://flowdesk-api:8000
    ports:
      - "3000:3000"
    depends_on:
      flowdesk-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: